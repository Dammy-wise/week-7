spring:
  datasource:
    url: jdbc:h2:mem:commerce;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
server:
  port: 8080
logging:
  level:
    com.compcorp.commerce: INFO
